server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: devflow-platform
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:devflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false # H2 DDL auto update handles in-memory tests

devflow:
  jwt:
    secret: "DevFlowEnterpriseSecretKey2026SecureLocalTokenSigningKeyForSoftwareDeliveryPlatform"
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: "./storage/deliverables"
    max-file-size-bytes: 104857600 # 100MB
